# paperlint configuration for one paper. Put this file next to your main .tex file.
# Every key is optional; the values shown are the defaults.

[paper]
files = ["main.tex"]          # files linted when you run lint.py with no arguments
bib = ["refs.bib"]            # bibliography files for check_refs.py
glossary = "glossary.toml"    # this paper's terminology decisions (see glossary.toml)
audience = ""                 # who reads the paper, e.g. "PRA: quantum optics and many-body theory".
                              # Terms this reader knows get a reference, not a definition.

# Style notes: used only when [checks] style = true (or by `lint.py --style`). They are
# hints for the author to read, never targets to rewrite toward.
[style]
max_sentence_words = 25       # sentences above this are reported as info (PL015)
hard_sentence_words = 27      # sentences above this are warnings (PL001)
ban_colons = true             # PL002
ban_semicolons = true         # PL003
ban_em_dash = true            # PL004 (en dashes in ranges and names are always fine)
emph_max_words = 4            # longer \emph{...} spans are reported (PL009)
reference_style = "cleveref"  # "cleveref": flag hand-typed Eq.~\ref{...}; "any": allow them
max_word_repeats = 2          # a modifier used more often in one paragraph is reported (PL018)
max_paragraph_words = 150     # longer paragraphs are reported (PL022)


[words]
known_acronyms = []           # acronyms that need no definition in your field, e.g. ["DNA"]
allow = []                    # default banned patterns to switch off, e.g. ["\\bvery\\b"]
ban = [                       # extra phrases to ban in this paper
  # "clearly",
  # { pattern = "\\bstate-of-the-art\\b", advice = "say what it improves on" },
]
anthropomorphic = []          # extra verbs to flag as anthropomorphic
repeat_ok = []                # modifiers this paper may repeat, e.g. ["finite"] (PL018)

[comments]                    # /paperlint:comments, applied every round
topics = []                   # key references added each round, e.g. ["TWA", "open systems"]
exclude = []                  # labels never changed as a consequence, e.g. ["app:cost"]
legend = ""                   # the reviewer's colours, e.g. "red = concept, blue = wording"

[checks]
style = false                 # true: also run every style check (as notes)
enable = []                   # style checks to run one by one, e.g. ["PL007", "PL013"]
disable = []                  # check codes to switch off, e.g. ["PL011"]
